@if (task) {
  <article>
    <h2>{{ task.title }}</h2>
    <p>{{ task.summary }}</p>
    <time>{{ task.dueDate | date: 'dd/MM/yyyy' }}</time>
    <div class="actions">
      <button (click)="onCompleteTask()">Finalizar</button>
    </div>
  </article>
} @else {
  <p>Nenhuma tarefa para {{ user.name }}</p>
}
