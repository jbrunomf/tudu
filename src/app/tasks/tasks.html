@if (isAddingTask) {
  <app-new-task (close)="onCancelAddTask()" [userId]="user!.id"/>
}

@if (user) {
  <section id="tasks">
    <header>
      <h2>Tarefas de: {{ user.name }}</h2>
      <menu>
        <button (click)="onStartAddTask()">Adicionar Tarefa</button>
      </menu>
    </header>
    @for (task of selectedUserTasks; track task.id) {
      <app-task [task]="task" />
    }
  </section>
}
